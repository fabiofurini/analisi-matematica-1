# Modello di mkdocs.yml: la nav dei capitoli la inserisce genera_sito.py.
# Non modificare mkdocs.yml a mano: si modifica questo file e si rigenera.
site_name: Analisi Matematica 1 · Fabio Furini
site_description: >-
  Analisi Matematica 1: la dispensa del corso online, con definizioni,
  teoremi e dimostrazioni, esempi svolti, esercizi e grafici interattivi.
site_author: Fabio Furini
site_url: https://fabiofurini.github.io/analisi-matematica-1/
repo_url: https://github.com/fabiofurini/analisi-matematica-1
copyright: >-
  &copy; 2026 Fabio Furini — testi, figure e dati con licenza
  <a href="https://creativecommons.org/licenses/by/4.0/deed.it">CC BY 4.0</a>,
  codice con licenza
  <a href="https://github.com/fabiofurini/analisi-matematica-1/blob/main/LICENSE-CODE">MIT</a>

theme:
  name: material
  language: it
  icon:
    logo: material/function-variant
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Tema chiaro
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang: it

extra:
  social:
    - icon: material/web
      link: https://sites.google.com/view/fabiofurini/home-page
      name: Fabio Furini — sito personale
    - icon: material/school
      link: https://www.diag.uniroma1.it/
      name: DIAG — Sapienza Università di Roma
    - icon: fontawesome/brands/github
      link: https://github.com/fabiofurini
      name: GitHub
    - icon: material/chart-timeline-variant
      link: https://fabiofurini.github.io/laboratorio-ricerca-operativa/
      name: Laboratorio di Ricerca Operativa
    - icon: material/vector-polygon
      link: https://fabiofurini.github.io/modellazione-mip/
      name: Modellazione MIP
    - icon: material/matrix
      link: https://fabiofurini.github.io/algebra-lineare/
      name: Algebra lineare
  alternate:
    - name: Italiano
      link: https://fabiofurini.github.io/analisi-matematica-1/
      lang: it
    - name: English
      link: https://fabiofurini.github.io/mathematical-analysis-1/
      lang: en

extra_css:
  - stylesheets/extra.css
  - https://cdn.jsdelivr.net/npm/jsxgraph@1.10.1/distrib/jsxgraph.css
  - stylesheets/interattivi.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      title: In questa pagina
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/cloudflare-analytics.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/jsxgraph@1.10.1/distrib/jsxgraphcore.js
  - javascripts/interattivi.js

nav:
  - Home: index.md
  - Numeri e logica:
      - numeri/index.md
      - "1. Insiemi": numeri/01-insiemi.md
      - "2. Basi di logica e tecniche di dimostrazione": numeri/02-logica.md
      - "3. Insiemi numerici e intervalli": numeri/03-insiemi-numerici.md
      - "4. Relazioni binarie": numeri/04-relazioni-binarie.md
      - "5. Campi ordinati, estremo superiore/inferiore e assioma di continuità": numeri/05-campi-ordinati.md
      - "6. Radicali, potenze, logaritmi e aritmetica modulare": numeri/06-radicali-potenze-logaritmi.md
      - "7. Sommatorie e progressioni geometriche": numeri/07-sommatorie.md
      - "8. Principio di induzione": numeri/08-induzione.md
      - "9. Fattoriali, coefficienti binomiali e disuguaglianza triangolare": numeri/09-fattoriali-binomiali.md
      - "10. Successione di Fibonacci": numeri/10-fibonacci.md
      - "11. Cardinalità degli insiemi infiniti": numeri/11-insiemi-infiniti.md
      - "12. Numeri complessi": numeri/12-numeri-complessi.md
  - Funzioni:
      - funzioni/index.md
      - "1. Le funzioni": funzioni/01-funzioni.md
      - "2. Funzioni reali di variabile reale": funzioni/02-funzioni-reali.md
      - "3. Funzioni potenza": funzioni/03-potenza.md
      - "4. Funzioni esponenziali e logaritmiche": funzioni/04-esponenziali-logaritmi.md
      - "5. Funzioni trigonometriche": funzioni/05-trigonometriche.md
      - "6. Fenomeni vibratori": funzioni/06-fenomeni-vibratori.md
      - "7. Funzioni parte intera e mantissa": funzioni/07-parte-intera.md
      - "8. Funzioni iperboliche": funzioni/08-iperboliche.md
      - "9. Operazioni sui grafici": funzioni/09-operazioni-grafici.md
      - "10. Funzioni composte": funzioni/10-composte.md
      - "11. Funzioni inverse": funzioni/11-inverse.md
  - Limiti di successioni:
      - successioni/index.md
      - "1. Successioni e limiti di successioni": successioni/01-limiti-successioni.md
      - "2. Calcolo dei limiti delle successioni": successioni/02-calcolo-limiti.md
      - "3. Il numero di Nepero": successioni/03-nepero.md
      - "4. Confronti e stime asintotiche": successioni/04-stime-asintotiche.md
      - "5. Gerarchie degli infiniti e criterio del rapporto": successioni/05-gerarchie-infiniti.md
      - "6. Successioni definite per ricorrenza": successioni/06-ricorrenza.md
  - Limiti di funzioni e continuità:
      - limiti/index.md
      - "1. Limiti di funzioni, asintoti e continuità": limiti/01-limiti-asintoti.md
      - "2. Calcolo dei limiti di funzioni": limiti/02-calcolo-limiti.md
      - "3. Limiti di polinomi e funzioni razionali": limiti/03-polinomi-razionali.md
      - "4. Funzioni continue": limiti/04-funzioni-continue.md
      - "5. Confronto degli infiniti": limiti/05-confronto-infiniti.md
      - "6. Limiti notevoli e stime asintotiche": limiti/06-limiti-notevoli.md
      - "7. Sviluppi asintotici": limiti/07-sviluppi-asintotici.md
      - "8. Teorema degli zeri e metodo della bisezione": limiti/08-zeri-bisezione.md
